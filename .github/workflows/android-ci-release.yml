name: Folia Android CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Prepare release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/folia-release.jks"
            echo "FOLIA_KEYSTORE_PATH=$RUNNER_TEMP/folia-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from repository secrets."
          else
            echo "No FOLIA_KEYSTORE_BASE64 secret set; release APKs fall back to debug signing."
          fi

      - name: Build debug and release APKs
        env:
          FOLIA_KEYSTORE_PASSWORD: ${{ secrets.FOLIA_KEYSTORE_PASSWORD }}
          FOLIA_KEY_ALIAS: ${{ secrets.FOLIA_KEY_ALIAS }}
          FOLIA_KEY_PASSWORD: ${{ secrets.FOLIA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Verify release APKs are signed
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)"
          # Without a private key from secrets, the APKs must carry the committed sideload key's signature.
          EXPECTED=""
          if [ -z "${FOLIA_KEYSTORE_PATH:-}" ]; then
            EXPECTED="$(keytool -list -v -keystore signing/folia-sideload.jks -storepass folia-sideload 2>/dev/null \
              | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
            echo "Expected sideload certificate SHA-256: $EXPECTED"
          fi
          COUNT=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            OUT="$("$APKSIGNER" verify --print-certs "$apk")"
            echo "$OUT"
            if [ -n "$EXPECTED" ]; then
              echo "$OUT" | grep -q "certificate SHA-256 digest: $EXPECTED" \
                || { echo "::error::$apk is not signed with the committed sideload key"; exit 1; }
            fi
            COUNT=$((COUNT + 1))
          done
          test "$COUNT" -gt 0

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folia-android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving the published release untouched."
            exit 0
          fi

          # Checksums so downloads can be verified (sha256sum -c SHA256SUMS.txt)
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

          # Release notes come from docs/release-notes/<tag>.md (kept in the repository and reviewed like code)
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [ ! -f "${NOTES_FILE}" ]; then
            NOTES_FILE="$RUNNER_TEMP/notes.md"
            printf '## Folia %s\n\nSee CHANGELOG.md for details.\n' "${TAG}" > "${NOTES_FILE}"
          fi

          PRERELEASE=""
          case "${VERSION}" in *-*) PRERELEASE="--prerelease";; esac

          gh release create "${TAG}" release-assets/*.apk release-assets/SHA256SUMS.txt \
            --title "Folia ${TAG}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${NOTES_FILE}" ${PRERELEASE}
