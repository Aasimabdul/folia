name: Folia Android CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Prepare release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/folia-release.jks"
            echo "FOLIA_KEYSTORE_PATH=$RUNNER_TEMP/folia-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from repository secrets."
          else
            echo "No FOLIA_KEYSTORE_BASE64 secret set; release APKs fall back to debug signing."
          fi

      - name: Build debug and release APKs
        env:
          FOLIA_KEYSTORE_PASSWORD: ${{ secrets.FOLIA_KEYSTORE_PASSWORD }}
          FOLIA_KEY_ALIAS: ${{ secrets.FOLIA_KEY_ALIAS }}
          FOLIA_KEY_PASSWORD: ${{ secrets.FOLIA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Verify release APKs are signed
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)"
          COUNT=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --print-certs "$apk"
            COUNT=$((COUNT + 1))
          done
          test "$COUNT" -gt 0

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folia-android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving the published release untouched."
            exit 0
          fi
          gh release create "${TAG}" app/build/outputs/apk/release/*.apk \
            --title "Folia ${TAG} — Minimalist Reading Experience" \
            --target "${GITHUB_SHA}" \
            --notes-file <(cat <<NOTES
          ## Folia ${TAG}

          ### What's new
          - Folia now appears in the file manager's "Open with" list for documents (Just once / Always),
            matching by file type and by file extension, and also in the share sheet.
          - Opening a file from a file manager reuses the running app instead of starting a second copy.
          - Theme switch in Settings: System default, Light or Dark (remembered).
          - New dark palette: deep ink-navy surfaces, soft blue accent, readable contrast; dialogs, menus
            and navigation follow it. Dark and sepia reading modes now recolor the pages themselves.
          - Bumped Android version to ${VERSION} (version code 5).

          ### Downloads
          Choose the APK matching your device architecture. Most modern Android phones use **arm64-v8a**.

          ### Build verification
          Unit tests and Android debug/release builds must pass in this workflow before this release is published.
          NOTES
          )
