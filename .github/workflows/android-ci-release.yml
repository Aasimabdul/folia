name: Folia Android CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folia-android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving the published release untouched."
            exit 0
          fi
          gh release create "${TAG}" app/build/outputs/apk/release/*.apk \
            --title "Folia ${TAG} — Minimalist Reading Experience" \
            --target "${GITHUB_SHA}" \
            --notes-file <(cat <<NOTES
          ## Folia ${TAG}

          ### What's new
          - Refined minimalist paper-and-blue visual identity.
          - Updated light and dark surfaces for a calmer reading experience.
          - Polished home-screen spacing, copy, and navigation elevation.
          - Bumped Android version to ${VERSION} (version code 3).

          ### Downloads
          Choose the APK matching your device architecture. Most modern Android phones use **arm64-v8a**.

          ### Build verification
          Unit tests and Android debug/release builds must pass in this workflow before this release is published.
          NOTES
          )
